<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GUARDIÃO - Sistema de Ronda e Ocorrências</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d; color: #f8fafc; min-height: 100vh;
      display: flex; flex-direction: column; padding: 12px; gap: 12px;
    }

    .app-bar {
      background: #171717; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 2px solid #eab308;
      border-radius: 8px;
    }
    .brand-title h1 { font-size: 1.1rem; color: #ffffff; font-weight: 900; }
    .brand-title span { font-size: 0.6rem; color: #eab308; font-weight: 700; display: block; }

    .container { max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }

    .card { background: #171717; padding: 14px; border-radius: 10px; border: 1px solid #262626; }
    .card label { font-size: 0.75rem; color: #eab308; font-weight: 800; display: block; margin-bottom: 4px; }
    
    .input-field, select, textarea {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #404040;
      background: #0d0d0d; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 8px;
      font-family: inherit;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tab-btn {
      padding: 10px; background: #262626; color: #aaa; border: none;
      border-radius: 6px; font-weight: 800; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: #eab308; color: #000; }

    .btn-select {
      width: 100%; padding: 14px; border: 2px dashed #eab308; border-radius: 10px;
      background: #1a1805; color: #eab308; font-size: 0.9rem; font-weight: 800;
      cursor: pointer; text-align: center; display: block; margin-top: 5px;
    }

    .btn-action {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #16a34a; color: #fff; font-size: 1rem; font-weight: 900;
      cursor: pointer; margin-top: 10px;
    }

    .btn-report { background: #2563eb; color: #fff; margin-top: 5px; }
    .btn-danger { background: #dc2626; color: #fff; margin-top: 5px; font-size: 0.8rem; padding: 8px; }

    .preview-grid {
      display: grid; grid-template-columns: repeat( auto-fill, minmax(80px, 1fr) );
      gap: 8px; margin-top: 10px; max-height: 150px; overflow-y: auto;
    }
    .preview-item {
      position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
      border: 1px solid #404040; background: #000;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Estilos do Relatório Impresso / Gerado */
    .report-modal {
      display: none; position: fixed; inset: 0; background: #000;
      z-index: 100; padding: 15px; overflow-y: auto; color: #000;
    }
    .report-paper {
      background: #fff; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto;
    }
    .report-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
    .report-section { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .report-img-card { border: 1px solid #ccc; padding: 4px; border-radius: 4px; }
    .report-img-card img { width: 100%; border-radius: 2px; }
    .badge-prio {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; color: #fff;
    }
    .prio-ALTA { background: #dc2626; }
    .prio-MÉDIA { background: #d97706; }
    .prio-BAIXA { background: #16a34a; }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="app-bar">
    <div class="brand-title">
      <h1>🛡️ GUARDIÃO</h1>
      <span>SISTEMA DE PLANTÃO</span>
    </div>
  </div>

  <div class="container">
    <!-- Configurações do Agente -->
    <div class="card">
      <label>AGENTE EM PLANTÃO:</label>
      <input type="text" id="txtAgente" class="input-field" value="CARLOS SILVA" placeholder="Nome do Agente">
    </div>

    <!-- Alternador de Abas: Ronda x Ocorrência -->
    <div class="tabs">
      <button class="tab-btn active" id="tabRonda" onclick="switchTab('RONDA')">🔄 RONDAS</button>
      <button class="tab-btn" id="tabOcorrencia" onclick="switchTab('OCORRENCIA')">⚠️ OCORRÊNCIAS</button>
    </div>

    <!-- PAINEL DE RONDAS -->
    <div class="card" id="panelRonda">
      <div class="grid-2">
        <div>
          <label>Nº DA RONDA:</label>
          <input type="number" id="numRonda" class="input-field" value="1" min="1">
        </div>
        <div>
          <label>DATA/HORA:</label>
          <select id="selectDataRonda" class="input-field">
            <option value="AGORA">Hora Atual</option>
            <option value="ARQUIVO">Hora da Foto</option>
          </select>
        </div>
      </div>

      <label for="fileRonda" class="btn-select">📂 CARREGAR FOTOS DA RONDA</label>
      <input type="file" id="fileRonda" accept="image/*" multiple style="display: none;">

      <div class="preview-grid" id="previewRonda"></div>
      <button id="btnSaveRonda" class="btn-action" style="display:none;">💾 SALVAR RONDA NO SISTEMA</button>
    </div>

    <!-- PAINEL DE OCORRÊNCIAS -->
    <div class="card" id="panelOcorrencia" style="display:none;">
      <div class="grid-2">
        <div>
          <label>PRIORIDADE:</label>
          <select id="selectPrio" class="input-field">
            <option value="BAIXA">🟢 BAIXA</option>
            <option value="MÉDIA">🟠 MÉDIA</option>
            <option value="ALTA">🔴 ALTA</option>
          </select>
        </div>
        <div>
          <label>LOCAL / POSTO:</label>
          <input type="text" id="txtLocalOcorrencia" class="input-field" placeholder="Ex: Portão B">
        </div>
      </div>

      <label>DESCRIÇÃO DA OCORRÊNCIA:</label>
      <textarea id="txtDescOcorrencia" class="input-field" rows="2" placeholder="Relate o que aconteceu..."></textarea>

      <label for="fileOcorrencia" class="btn-select">📂 FOTOS DA OCORRÊNCIA</label>
      <input type="file" id="fileOcorrencia" accept="image/*" multiple style="display: none;">

      <div class="preview-grid" id="previewOcorrencia"></div>
      <button id="btnSaveOcorrencia" class="btn-action" style="display:none;">💾 REGISTRAR OCORRÊNCIA</button>
    </div>

    <!-- RESUMO DO PLANTÃO E AÇÕES -->
    <div class="card">
      <label>REGISTROS SALVOS NO DISPOSITIVO:</label>
      <div id="statusStorage" style="font-size: 0.85rem; color: #aaa; margin: 5px 0;">Carregando registros...</div>

      <button onclick="generateReport()" class="btn-action btn-report">📋 GERAR RELATÓRIO DO PLANTÃO</button>
      <button onclick="clearAllData()" class="btn-action btn-danger">🗑️ LIMPAR PLANTÃO ATUAL</button>
    </div>
  </div>

  <!-- MODAL DO RELATÓRIO FINAL -->
  <div class="report-modal" id="reportModal">
    <div class="report-paper">
      <div class="report-header">
        <h2>🛡️ RELATÓRIO DE PLANTÃO - GUARDIÃO</h2>
        <p><strong>Agente:</strong> <span id="repAgente"></span></p>
        <p><strong>Emissão:</strong> <span id="repData"></span></p>
      </div>

      <div id="repContent"></div>

      <button onclick="window.print()" class="btn-action" style="background:#000; margin-top:15px;">🖨️ IMPRIMIR / SALVAR PDF</button>
      <button onclick="closeReport()" class="btn-action btn-danger">FECHAR</button>
    </div>
  </div>

  <canvas id="workCanvas"></canvas>

  <script>
    // Configuração do IndexedDB (Banco de dados local do celular)
    let db;
    const request = indexedDB.open("GuardiaoDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("registros")) {
        db.createObjectStore("registros", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      updateStorageStatus();
    };

    // Alternar Abas
    function switchTab(tab) {
      document.getElementById('tabRonda').classList.toggle('active', tab === 'RONDA');
      document.getElementById('tabOcorrencia').classList.toggle('active', tab === 'OCORRENCIA');
      document.getElementById('panelRonda').style.display = tab === 'RONDA' ? 'block' : 'none';
      document.getElementById('panelOcorrencia').style.display = tab === 'OCORRENCIA' ? 'block' : 'none';
    }

    // Gerenciador de Fotos - Ronda
    let rondaFiles = [];
    document.getElementById('fileRonda').addEventListener('change', (e) => {
      rondaFiles = Array.from(e.target.files);
      renderPreview(rondaFiles, 'previewRonda');
      document.getElementById('btnSaveRonda').style.display = rondaFiles.length ? 'block' : 'none';
    });

    // Gerenciador de Fotos - Ocorrência
    let ocorrenciaFiles = [];
    document.getElementById('fileOcorrencia').addEventListener('change', (e) => {
      ocorrenciaFiles = Array.from(e.target.files);
      renderPreview(ocorrenciaFiles, 'previewOcorrencia');
      document.getElementById('btnSaveOcorrencia').style.display = ocorrenciaFiles.length ? 'block' : 'none';
    });

    function renderPreview(files, containerId) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `<img src="${e.target.result}">`;
          grid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    // Processar e Salvar Ronda
    document.getElementById('btnSaveRonda').addEventListener('click', async () => {
      const agente = document.getElementById('txtAgente').value.toUpperCase();
      const numRonda = document.getElementById('numRonda').value;
      const modoData = document.getElementById('selectDataRonda').value;

      const processedImages = [];
      for (let i = 0; i < rondaFiles.length; i++) {
        const file = rondaFiles[i];
        const dateStr = modoData === 'AGORA' ? getNowStr() : getFileDateStr(file);
        const imgData = await stampImage(file, `RONDA ${numRonda} - FOTO ${i+1}`, agente, dateStr);
        processedImages.push(imgData);
      }

      const record = {
        tipo: 'RONDA',
        titulo: `Ronda nº ${numRonda}`,
        agente: agente,
        dataHora: getNowStr(),
        imagens: processedImages
      };

      saveToDB(record, () => {
        alert(`Ronda ${numRonda} salva com sucesso!`);
        rondaFiles = [];
        document.getElementById('previewRonda').innerHTML = '';
        document.getElementById('btnSaveRonda').style.display = 'none';
        document.getElementById('numRonda').value = parseInt(numRonda) + 1;
        updateStorageStatus();
      });
    });

    // Processar e Salvar Ocorrência
    document.getElementById('btnSaveOcorrencia').addEventListener('click', async () => {
      const agente = document.getElementById('txtAgente').value.toUpperCase();
      const prioridade = document.getElementById('selectPrio').value;
      const local = document.getElementById('txtLocalOcorrencia').value.toUpperCase() || 'NÃO INFORMADO';
      const descricao = document.getElementById('txtDescOcorrencia').value || 'Sem descrição';

      const processedImages = [];
      for (let i = 0; i < ocorrenciaFiles.length; i++) {
        const file = ocorrenciaFiles[i];
        const imgData = await stampImage(file, `OCORRÊNCIA [${prioridade}] - FOTO ${i+1}`, agente, getNowStr());
        processedImages.push(imgData);
      }

      const record = {
        tipo: 'OCORRENCIA',
        prioridade: prioridade,
        local: local,
        descricao: descricao,
        agente: agente,
        dataHora: getNowStr(),
        imagens: processedImages
      };

      saveToDB(record, () => {
        alert("Ocorrência registrada com sucesso!");
        ocorrenciaFiles = [];
        document.getElementById('previewOcorrencia').innerHTML = '';
        document.getElementById('btnSaveOcorrencia').style.display = 'none';
        document.getElementById('txtDescOcorrencia').value = '';
        updateStorageStatus();
      });
    });

    // Função para Estampar a Imagem
    function stampImage(file, titulo, agente, dataStr) {
      return new Promise((resolve) => {
        const canvas = document.getElementById('workCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          const w = img.width;
          const h = img.height;
          const footerH = h * 0.18;
          const footerY = h - footerH;

          ctx.fillStyle = 'rgba(13, 13, 13, 0.85)';
          ctx.fillRect(0, footerY, w, footerH);

          ctx.fillStyle = '#eab308';
          ctx.fillRect(0, footerY, w, footerH * 0.04);

          const padX = w * 0.04;

          ctx.fillStyle = '#eab308';
          ctx.font = `900 ${footerH * 0.30}px sans-serif`;
          ctx.fillText(titulo, padX, footerY + (footerH * 0.40));

          ctx.fillStyle = '#ffffff';
          ctx.font = `700 ${footerH * 0.20}px sans-serif`;
          ctx.fillText(`AGENTE: ${agente}  |  ${dataStr}`, padX, footerY + (footerH * 0.75));

          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // Auxiliares de Banco de Dados
    function saveToDB(record, callback) {
      const tx = db.transaction("registros", "readwrite");
      const store = tx.objectStore("registros");
      store.add(record);
      tx.oncomplete = callback;
    }

    function updateStorageStatus() {
      const tx = db.transaction("registros", "readonly");
      const store = tx.objectStore("registros");
      const req = store.getAll();
      req.onsuccess = () => {
        const list = req.result;
        const rondas = list.filter(r => r.tipo === 'RONDA').length;
        const ocorrencias = list.filter(r => r.tipo === 'OCORRENCIA').length;
        document.getElementById('statusStorage').innerHTML = `📌 <strong>${rondas}</strong> Rondas salvas | ⚠️ <strong>${ocorrencias}</strong> Ocorrências registradas`;
      };
    }

    function clearAllData() {
      if (confirm("Deseja apagar todos os registros do plantão atual?")) {
        const tx = db.transaction("registros", "readwrite");
        tx.objectStore("registros").clear();
        tx.oncomplete = () => {
          alert("Plantão limpo com sucesso!");
          updateStorageStatus();
        };
      }
    }

    // Gerar Relatório Consolidado
    function generateReport() {
      const tx = db.transaction("registros", "readonly");
      const store = tx.objectStore("registros");
      const req = store.getAll();

      req.onsuccess = () => {
        const records = req.result;
        if (records.length === 0) {
          alert("Nenhum registro encontrado para gerar o relatório.");
          return;
        }

        document.getElementById('repAgente').innerText = document.getElementById('txtAgente').value;
        document.getElementById('repData').innerText = getNowStr();

        let html = '';
        records.forEach((rec, idx) => {
          if (rec.tipo === 'RONDA') {
            html += `
              <div class="report-section">
                <h3>🔄 ${rec.titulo}</h3>
                <p><small>Registrado em: ${rec.dataHora}</small></p>
                <div class="report-grid">
                  ${rec.imagens.map(img => `<div class="report-img-card"><img src="${img}"></div>`).join('')}
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="report-section">
                <h3>⚠️ OCORRÊNCIA - <span class="badge-prio prio-${rec.prioridade}">${rec.prioridade}</span></h3>
                <p><strong>Local:</strong> ${rec.local}</p>
                <p><strong>Descrição:</strong> ${rec.descricao}</p>
                <p><small>Registrado em: ${rec.dataHora}</small></p>
                <div class="report-grid">
                  ${rec.imagens.map(img => `<div class="report-img-card"><img src="${img}"></div>`).join('')}
                </div>
              </div>
            `;
          }
        });

        document.getElementById('repContent').innerHTML = html;
        document.getElementById('reportModal').style.display = 'block';
      };
    }

    function closeReport() {
      document.getElementById('reportModal').style.display = 'none';
    }

    // Datas formatadas
    function getNowStr() {
      const d = new Date();
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getFileDateStr(file) {
      const d = new Date(file.lastModified);
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
  </script>
</body>
</html>
