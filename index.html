<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUARDIÃO - Sistema de Ronda</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d0d0d; color: #f8fafc; padding: 12px; }
    
    .app-bar { background: #171717; padding: 15px; border-bottom: 3px solid #eab308; border-radius: 8px; text-align: center; margin-bottom: 15px; }
    .card { background: #171717; padding: 15px; border-radius: 10px; border: 1px solid #262626; margin-bottom: 12px; }
    .input-field { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #404040; background: #0d0d0d; color: #fff; margin-bottom: 8px; }
    
    .btn-select { width: 100%; padding: 14px; border: 2px dashed #eab308; background: #1a1805; color: #eab308; cursor: pointer; text-align: center; display: block; border-radius: 8px; font-weight: 800; }
    .btn-process { width: 100%; padding: 14px; background: #16a34a; border: none; border-radius: 8px; color: #fff; font-weight: 900; margin-top: 10px; cursor: pointer; }
    .btn-report { width: 100%; padding: 14px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-weight: 900; margin-top: 10px; cursor: pointer; }

    /* Cards de Conferência */
    .topic-card { border: 1px solid #404040; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #1a1a1a; }
    .topic-title { color: #eab308; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .thumb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .thumb { aspect-ratio: 1; border-radius: 4px; border: 1px solid #444; overflow: hidden; background: #000; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Modal Relatório */
    .modal { display: none; position: fixed; inset: 0; background: #fff; z-index: 100; overflow-y: auto; padding: 20px; color: #000; }
    
    @media print {
        .no-print { display: none; }
        .modal { display: block !important; position: static; background: white; }
    }
  </style>
</head>
<body>

  <div class="app-bar no-print"><h1>🛡️ GUARDIÃO</h1></div>

  <div class="container no-print">
    <div class="card">
      <label>AGENTE:</label>
      <input type="text" id="txtAgente" class="input-field" value="CARLOS SILVA">
    </div>

    <div class="card">
      <label>🔄 NOVA RONDA (1 a 10)</label>
      <input type="number" id="numRonda" class="input-field" value="1" min="1" max="10">
      <label for="fileRonda" class="btn-select">SELECIONAR FOTOS</label>
      <input type="file" id="fileRonda" multiple style="display:none">
      <button id="btnProcess" class="btn-process">PROCESSAR E EXIBIR RONDA</button>
    </div>

    <div id="topicContainer"></div>
    <button onclick="openReport()" class="btn-report">📋 GERAR RELATÓRIO PDF</button>
  </div>

  <!-- Modal do Relatório -->
  <div id="reportModal" class="modal">
      <div style="max-width: 800px; margin: auto;">
          <h2 style="border-bottom: 2px solid #000; padding-bottom: 10px;">RELATÓRIO DE PLANTÃO - GUARDIÃO</h2>
          <div id="repContent"></div>
          <br>
          <button onclick="window.print()" class="btn-process no-print">IMPRIMIR / SALVAR PDF</button>
          <button onclick="document.getElementById('reportModal').style.display='none'" class="btn-process no-print" style="background:#666">FECHAR</button>
      </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let db;

    const request = indexedDB.open("GuardiaoDB", 5);
    request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("regs", { autoIncrement: true }); };
    request.onsuccess = (e) => { db = e.target.result; loadTopics(); };

    document.getElementById('btnProcess').onclick = async () => {
        const files = document.getElementById('fileRonda').files;
        let num = parseInt(document.getElementById('numRonda').value);
        
        if(num > 10) { alert("Limite máximo de 10 rondas atingido!"); return; }

        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        let processed = [];
        
        for(let file of files) {
            processed.push(await drawStamp(file, num, time));
        }
        
        const tx = db.transaction("regs", "readwrite");
        tx.objectStore("regs").add({ type: 'RONDA', num, time, images: processed });
        tx.oncomplete = () => { 
            loadTopics(); 
            document.getElementById('numRonda').value = num + 1; // Incrementa automaticamente
        };
    };

    function drawStamp(file, num, time) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const h = img.height * 0.2;
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, img.height-h, img.width, h);
                ctx.fillStyle = '#eab308';
                ctx.font = `bold ${h*0.3}px sans-serif`;
                ctx.fillText(`RONDA ${num} | ${time} | AGENTE: ${document.getElementById('txtAgente').value}`, 50, img.height - h*0.4);
                resolve(canvas.toDataURL('image/jpeg', 0.9));
            };
            img.src = URL.createObjectURL(file);
        });
    }

    function loadTopics() {
        const container = document.getElementById('topicContainer');
        container.innerHTML = '';
        const tx = db.transaction("regs", "readonly");
        tx.objectStore("regs").getAll().onsuccess = (e) => {
            e.target.result.forEach((reg) => {
                const div = document.createElement('div');
                div.className = 'topic-card';
                div.innerHTML = `
                    <div class="topic-title"><span>🔄 RONDA ${reg.num}</span> <span>${reg.time}</span></div>
                    <div class="thumb-grid">${reg.images.map(img => `<div class="thumb"><img src="${img}"></div>`).join('')}</div>
                `;
                container.appendChild(div);
            });
        };
    }

    function openReport() {
        const repContent = document.getElementById('repContent');
        repContent.innerHTML = '';
        const tx = db.transaction("regs", "readonly");
        tx.objectStore("regs").getAll().onsuccess = (e) => {
            e.target.result.forEach(reg => {
                const sec = document.createElement('div');
                sec.innerHTML = `<h3>RONDA ${reg.num} - ${reg.time}</h3>
                                 <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px;">
                                 ${reg.images.map(img => `<img src="${img}" style="width:100%; border:1px solid #ccc;">`).join('')}
                                 </div>`;
                repContent.appendChild(sec);
            });
            document.getElementById('reportModal').style.display = 'block';
        };
    }
  </script>
</body>
</html>
