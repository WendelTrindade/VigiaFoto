<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUARDIÃO v1.3.0</title>
  <style>
    :root { --gold: #eab308; --red: #dc2626; --bg: #0d0d0d; --card: #171717; --text: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    .header { background: var(--card); padding: 15px; border-bottom: 3px solid var(--gold); text-align: center; }
    .tab { display: none; padding: 15px; }
    .tab.active { display: block; }
    
    .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
    .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; margin-bottom: 10px; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: #fff; margin-top: 5px; }
    
    /* Pré-visualização */
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .preview-item { border: 2px solid #444; border-radius: 6px; overflow: hidden; background: #000; }
    .preview-item img { width: 100%; height: auto; display: block; }

    /* Admin Checkbox */
    .field-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
    
    .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; border-top: 1px solid #333; z-index: 1000; }
    .nav-btn { flex: 1; padding: 15px; text-align: center; border: none; background: none; color: #888; font-weight: bold; cursor: pointer; }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>
<body>

  <div class="header"><h1>🛡️ GUARDIÃO</h1><small>v1.3.0</small></div>

  <!-- ABA 1: REGISTRO -->
  <div id="tab1" class="tab active">
    <div class="card">
        <label>TIPO DE REGISTRO:</label>
        <select id="regType" class="input-field" onchange="toggleObs()">
            <option value="RONDA">🔄 RONDA</option>
            <option value="OCORRENCIA">⚠️ OCORRÊNCIA</option>
        </select>
        <input type="text" id="inpNum" class="input-field" placeholder="Número (Ronda/Ocorrência)">
        <textarea id="inpObs" class="input-field" placeholder="Observações (Apenas para Ocorrências)" style="display:none"></textarea>
        
        <label for="fileInput" class="btn" style="background:#444;">📁 SELECIONAR FOTOS</label>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="showPreview()">
        
        <button onclick="processar()" class="btn" style="background:var(--gold); color:#000;">PROCESSAR E SALVAR</button>
    </div>
    
    <h3>Conferência:</h3>
    <div id="previewContainer" class="preview-grid"></div>
  </div>

  <!-- ABA 2: ADMIN -->
  <div id="tab2" class="tab">
    <div class="card">
        <h3>⚙️ CONFIGURAR ESTAMPA</h3>
        <div id="adminFields"></div>
        <div style="margin-top:20px; border-top:1px solid #333; pt:10px;">
            <input type="text" id="newFieldLabel" class="input-field" placeholder="Nome do novo campo (ex: Local)">
            <button onclick="addField()" class="btn" style="background:#555;">+ ADICIONAR CAMPO</button>
            <button onclick="saveConfig()" class="btn" style="background:var(--gold); color:#000;">SALVAR CONFIGURAÇÕES</button>
        </div>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn active" onclick="showTab(1)">REGISTRO</button>
    <button class="nav-btn" onclick="showTab(2)">ADMIN</button>
  </nav>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    let db;
    let config = JSON.parse(localStorage.getItem('guardiao_config')) || { fields: [{label:'Data', active:true}, {label:'Hora', active:true}, {label:'Agente', active:true}] };

    // DB e Init
    const request = indexedDB.open("GuardiaoDB", 10);
    request.onupgradeneeded = e => e.target.result.createObjectStore("regs", { autoIncrement: true });
    request.onsuccess = e => { db = e.target.result; renderAdmin(); };

    function toggleObs() {
        document.getElementById('inpObs').style.display = document.getElementById('regType').value === 'OCORRENCIA' ? 'block' : 'none';
    }

    function showTab(n) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab'+n).classList.add('active');
    }

    // --- LOGICA ADMIN ---
    function renderAdmin() {
        const div = document.getElementById('adminFields');
        div.innerHTML = '';
        config.fields.forEach((f, idx) => {
            div.innerHTML += `
                <div class="field-row">
                    <label>${f.label}</label>
                    <input type="checkbox" ${f.active ? 'checked' : ''} onchange="config.fields[${idx}].active = this.checked">
                </div>`;
        });
    }

    function addField() {
        const val = document.getElementById('newFieldLabel').value;
        if(val) {
            config.fields.push({label: val, active: true});
            renderAdmin();
            document.getElementById('newFieldLabel').value = '';
        }
    }

    function saveConfig() {
        localStorage.setItem('guardiao_config', JSON.stringify(config));
        alert("Configurações salvas!");
    }

    // --- LOGICA IMAGEM ---
    function showPreview() {
        const container = document.getElementById('previewContainer');
        container.innerHTML = '';
        const files = document.getElementById('fileInput').files;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                container.innerHTML += `<div class="preview-item"><img src="${e.target.result}"></div>`;
            };
            reader.readAsDataURL(file);
        });
    }

    async function processar() {
        const files = document.getElementById('fileInput').files;
        const container = document.getElementById('previewContainer');
        container.innerHTML = 'Processando...';
        
        let processedImages = [];
        for(let file of files) {
            processedImages.push(await drawStamp(file));
        }

        // Renderiza o resultado
        container.innerHTML = '';
        processedImages.forEach(src => {
            container.innerHTML += `<div class="preview-item"><img src="${src}"></div>`;
        });
        alert("Processado!");
    }

    function drawStamp(file) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                const h = img.height * 0.2;
                ctx.fillStyle = document.getElementById('regType').value === 'OCORRENCIA' ? 'rgba(200, 0, 0, 0.8)' : 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, img.height-h, img.width, h);
                
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${h*0.3}px sans-serif`;
                
                let text = config.fields.filter(f => f.active).map(f => f.label).join(' | ');
                ctx.fillText(text, 50, img.height - h*0.4);
                
                resolve(canvas.toDataURL('image/jpeg', 0.9));
            };
            img.src = URL.createObjectURL(file);
        });
    }
  </script>
</body>
</html>
