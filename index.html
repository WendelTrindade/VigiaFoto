<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GUARDIÃO - Registro de Ponto</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-bar {
      background: #171717;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eab308;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title h1 {
      font-size: 1.2rem;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .brand-title span {
      font-size: 0.65rem;
      color: #eab308;
      display: block;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .btn-admin {
      background: #262626;
      color: #eab308;
      border: 1px solid #eab308;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      padding: 15px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .vigia-card {
      background: #171717;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #262626;
    }
    .vigia-card label {
      font-size: 0.75rem;
      color: #eab308;
      text-transform: uppercase;
      font-weight: 800;
      display: block;
      margin-bottom: 6px;
    }
    .search-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #404040;
      background: #0d0d0d;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .badge-info {
      margin-top: 10px;
      padding: 10px;
      background: #0d0d0d;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #d4d4d4;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 3px solid #dc2626;
    }
    .badge-info strong { color: #ffffff; }

    .preview-card {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #262626;
      aspect-ratio: 3/4;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas, img { width: 100%; height: 100%; object-fit: cover; }

    .rec-status {
      position: absolute; top: 15px; left: 15px;
      background: rgba(220, 38, 38, 0.9); color: white;
      padding: 6px 12px; border-radius: 20px; font-weight: 800;
      font-size: 0.8rem; display: none; align-items: center; gap: 6px;
      z-index: 5;
    }
    .rec-dot { width: 10px; height: 10px; background: white; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-group-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn {
      width: 100%;
      padding: 15px 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-photo { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; }
    .btn-video { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); color: #fff; }
    .btn-stop { background: #eab308; color: #000; grid-column: span 2; }
    .btn-confirm { background: #16a34a; color: #fff; }
    .btn-cancel { background: #dc2626; color: #fff; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-content {
      max-width: 450px;
      margin: 0 auto;
      background: #171717;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #eab308;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .modal-header h2 { font-size: 1.2rem; color: #eab308; }
    .close-btn { background: none; border: none; color: #a3a3a3; font-size: 1.5rem; cursor: pointer; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: #a3a3a3; margin-bottom: 4px; }
    .form-group input {
      width: 100%; padding: 10px; border-radius: 6px;
      border: 1px solid #404040; background: #0d0d0d; color: #fff;
    }
    .list-item {
      padding: 10px;
      background: #0d0d0d;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border: 1px solid #262626;
    }
    .btn-del { background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-bar">
    <div class="brand-title">
      <div style="font-size: 1.4rem;">🛡️</div>
      <div>
        <h1>GUARDIÃO</h1>
        <span>SERVIÇOS DE QUALIDADE</span>
      </div>
    </div>
    <button class="btn-admin" id="btnOpenAdmin">⚙️ Admin</button>
  </div>

  <div class="container">
    <div class="vigia-card">
      <label for="searchVigia">NOME DO COLABORADOR:</label>
      <input type="text" id="searchVigia" class="search-input" list="vigiasList" placeholder="Digite seu nome...">
      <datalist id="vigiasList"></datalist>

      <div class="badge-info">
        <div>Posto: <strong id="lblPosto">POSTO CENTRAL</strong></div>
        <div>Serviço: <strong id="lblServico">GUARDIÃO SEGURANÇA</strong></div>
        <div>Local: <strong id="lblLocal">Obtendo localização...</strong></div>
      </div>
    </div>

    <div class="preview-card">
      <div class="rec-status" id="recBadge"><div class="rec-dot"></div> GRAVANDO VÍDEO...</div>
      <video id="videoSource" autoplay playsinline style="display:none;"></video>
      <canvas id="canvasDisplay"></canvas>
      <img id="photoResult" style="display: none;" />
      <video id="videoResult" controls style="display: none;"></video>
    </div>

    <div class="actions">
      <!-- Botões de Ação Principal -->
      <div id="mainControls" class="btn-group-main">
        <button id="btnTakePhoto" class="btn btn-photo">📸 TIRAR FOTO</button>
        <button id="btnStartRecord" class="btn btn-video">🎥 GRAVAR VÍDEO</button>
        <button id="btnStopRecord" class="btn btn-stop" style="display: none;">⏹️ PARAR GRAVAÇÃO</button>
      </div>

      <!-- Botões de Confirmação e Download -->
      <div id="confirmControls" style="display: none; flex-direction: column; gap: 10px;">
        <button id="btnConfirmSave" class="btn btn-confirm">✅ CONFIRMAR & SALVAR</button>
        <button id="btnCancelRetake" class="btn btn-cancel">🔄 CANCELAR E REPETIR</button>
      </div>
    </div>
  </div>

  <!-- Painel Admin -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Painel Guardião Gestor</h2>
        <button class="close-btn" id="btnCloseAdmin">&times;</button>
      </div>

      <div id="adminAuth">
        <div class="form-group">
          <label>Senha do Administrador:</label>
          <input type="password" id="adminPass" placeholder="Digite a senha">
        </div>
        <button class="btn btn-photo" id="btnLoginAdmin">Acessar Painel</button>
      </div>

      <div id="adminBody" style="display: none;">
        <h3 style="font-size: 0.9rem; color: #eab308; margin-bottom: 10px;">Cadastrar Novo Agente</h3>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="addNome" placeholder="Ex: Carlos Silva">
        </div>
        <div class="form-group">
          <label>Serviço / Categoria:</label>
          <input type="text" id="addServico" value="GUARDIÃO SEGURANÇA">
        </div>
        <div class="form-group">
          <label>Posto / Setor:</label>
          <input type="text" id="addPosto" value="POSTO CENTRAL">
        </div>
        <div class="form-group">
          <label>Endereço Fixo (Opcional):</label>
          <input type="text" id="addEndereco" placeholder="Deixe em branco para usar GPS">
        </div>
        <button class="btn btn-confirm" id="btnAddVigia" style="margin-bottom: 15px;">➕ Cadastrar Agente</button>

        <h3 style="font-size: 0.9rem; color: #d4d4d4; margin-bottom: 10px;">Equipe Cadastrada</h3>
        <div id="vigiasListaAdmin"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = '28642155';

    let dbVigias = JSON.parse(localStorage.getItem('dbVigias')) || [
      { id: 1, nome: 'CARLOS SILVA BATISTA', servico: 'GUARDIÃO SEGURANÇA', posto: 'POSTO CENTRAL', endereco: '' }
    ];
    let currentVigia = dbVigias[0];
    let gpsAddress = 'LOCALIZANDO GPS...';

    const videoSource = document.getElementById('videoSource');
    const canvas = document.getElementById('canvasDisplay');
    const ctx = canvas.getContext('2d');
    const photoResult = document.getElementById('photoResult');
    const videoResult = document.getElementById('videoResult');

    const btnTakePhoto = document.getElementById('btnTakePhoto');
    const btnStartRecord = document.getElementById('btnStartRecord');
    const btnStopRecord = document.getElementById('btnStopRecord');
    const btnConfirmSave = document.getElementById('btnConfirmSave');
    const btnCancelRetake = document.getElementById('btnCancelRetake');
    
    const mainControls = document.getElementById('mainControls');
    const confirmControls = document.getElementById('confirmControls');
    const recBadge = document.getElementById('recBadge');
    const searchVigia = document.getElementById('searchVigia');
    const vigiasList = document.getElementById('vigiasList');

    let mediaRecorder;
    let recordedChunks = [];
    let recordedBlob = null;
    let captureType = null; // 'photo' ou 'video'
    let isLoopActive = true;

    function initApp() {
      saveDB();
      renderVigiasDatalist();
      selectVigia(dbVigias[0].nome);
      initCamera();
      initGPS();
    }

    function saveDB() {
      localStorage.setItem('dbVigias', JSON.stringify(dbVigias));
    }

    function renderVigiasDatalist() {
      vigiasList.innerHTML = '';
      const listAdmin = document.getElementById('vigiasListaAdmin');
      listAdmin.innerHTML = '';

      dbVigias.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.nome;
        vigiasList.appendChild(opt);

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div>
            <strong style="color:#fff;">${v.nome}</strong><br>
            <small style="color:#eab308;">${v.posto} - ${v.servico}</small>
          </div>
          <button class="btn-del" onclick="deleteVigia(${v.id})">Remover</button>
        `;
        listAdmin.appendChild(item);
      });
    }

    function selectVigia(nome) {
      const found = dbVigias.find(v => v.nome.toUpperCase() === nome.toUpperCase());
      if (found) {
        currentVigia = found;
        document.getElementById('lblPosto').innerText = currentVigia.posto;
        document.getElementById('lblServico').innerText = currentVigia.servico;
        document.getElementById('lblLocal').innerText = currentVigia.endereco || gpsAddress;
      }
    }

    searchVigia.addEventListener('input', (e) => selectVigia(e.target.value));

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        videoSource.srcObject = stream;
        videoSource.play();
        requestAnimationFrame(renderLoop);
      } catch (e) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          videoSource.srcObject = stream;
          videoSource.play();
          requestAnimationFrame(renderLoop);
        } catch(err) {
          alert("Não foi possível acessar a câmera ou microfone.");
        }
      }
    }

    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
            const data = await res.json();
            const road = data.address.road || 'RUA REGISTRADA';
            const city = data.address.city || data.address.town || 'CIDADE';
            gpsAddress = `${road.toUpperCase()}, ${city.toUpperCase()}`;
            if (!currentVigia.endereco) {
              document.getElementById('lblLocal').innerText = gpsAddress;
            }
          } catch (e) { gpsAddress = "GPS ATIVO (ENDEREÇO INDISPONÍVEL)"; }
        });
      }
    }

    function drawFitText(ctx, text, x, y, maxWidth, baseFontSize, fontColor, fontWeight = '700') {
      let fontSize = baseFontSize;
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, sans-serif`;
      while (ctx.measureText(text).width > maxWidth && fontSize > 12) {
        fontSize -= 2;
        ctx.font = `${fontWeight} ${fontSize}px -apple-system, sans-serif`;
      }
      ctx.fillStyle = fontColor;
      ctx.fillText(text, x, y);
    }

    // Desenha o vídeo e a estampa em tempo real no Canvas
    function renderLoop() {
      if (!isLoopActive) return;

      const w = videoSource.videoWidth || 1280;
      const h = videoSource.videoHeight || 720;

      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }

      ctx.drawImage(videoSource, 0, 0, w, h);

      const footerH = h * 0.28;
      const footerY = h - footerH;

      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, footerY, w, footerH);

      ctx.fillStyle = '#eab308';
      ctx.fillRect(0, footerY, w, footerH * 0.025);

      const padX = w * 0.04;
      const contentWidth = w - (padX * 2);

      const now = new Date();
      const horaStr = String(now.getHours()).padStart(2, '0') + ':' + 
                      String(now.getMinutes()).padStart(2, '0') + ':' + 
                      String(now.getSeconds()).padStart(2, '0');
      const dataStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth()+1).padStart(2, '0')}/${now.getFullYear()}`;

      // Hora
      ctx.fillStyle = '#eab308';
      ctx.font = `900 ${footerH * 0.24}px -apple-system, sans-serif`;
      ctx.fillText(horaStr, padX, footerY + (footerH * 0.25));

      // Data abaixo da hora
      ctx.fillStyle = '#a3a3a3';
      ctx.font = `700 ${footerH * 0.11}px -apple-system, sans-serif`;
      ctx.fillText(`DATA: ${dataStr}`, padX, footerY + (footerH * 0.38));

      // Marca Guardião
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${footerH * 0.16}px -apple-system, sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText('GUARDIÃO', w - padX, footerY + (footerH * 0.25));
      ctx.textAlign = 'left';

      // Linha Separadora
      ctx.fillStyle = '#262626';
      ctx.fillRect(padX, footerY + (footerH * 0.44), contentWidth, 2);

      // Serviço e Posto
      const servicoPosto = `${currentVigia.servico} - ${currentVigia.posto}`;
      drawFitText(ctx, servicoPosto, padX, footerY + (footerH * 0.58), contentWidth, footerH * 0.11, '#eab308', '800');

      // Agente
      const agenteText = `COLABORADOR: ${currentVigia.nome}`;
      drawFitText(ctx, agenteText, padX, footerY + (footerH * 0.73), contentWidth, footerH * 0.10, '#ffffff', '700');

      // Local
      const localText = `LOCAL: ${currentVigia.endereco || gpsAddress}`;
      drawFitText(ctx, localText, padX, footerY + (footerH * 0.88), contentWidth, footerH * 0.09, '#d4d4d4', '600');

      requestAnimationFrame(renderLoop);
    }

    // AÇÃO 1: TIRAR FOTO
    btnTakePhoto.addEventListener('click', () => {
      captureType = 'photo';
      const imageData = canvas.toDataURL('image/jpeg', 0.95);
      photoResult.src = imageData;

      canvas.style.display = 'none';
      photoResult.style.display = 'block';
      
      mainControls.style.display = 'none';
      confirmControls.style.display = 'flex';
      isLoopActive = false;
    });

    // AÇÃO 2: GRAVAR VÍDEO
    btnStartRecord.addEventListener('click', () => {
      captureType = 'video';
      recordedChunks = [];

      const canvasStream = canvas.captureStream(30);
      const audioTrack = videoSource.srcObject.getAudioTracks()[0];
      if (audioTrack) canvasStream.addTrack(audioTrack);

      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
        videoResult.src = URL.createObjectURL(recordedBlob);

        canvas.style.display = 'none';
        videoResult.style.display = 'block';
        
        mainControls.style.display = 'none';
        confirmControls.style.display = 'flex';
        isLoopActive = false;
      };

      mediaRecorder.start();
      recBadge.style.display = 'flex';
      btnTakePhoto.style.display = 'none';
      btnStartRecord.style.display = 'none';
      btnStopRecord.style.display = 'flex';
    });

    btnStopRecord.addEventListener('click', () => {
      mediaRecorder.stop();
      recBadge.style.display = 'none';
      btnStopRecord.style.display = 'none';
      btnTakePhoto.style.display = 'flex';
      btnStartRecord.style.display = 'flex';
    });

    // CONFIRMAR E SALVAR
    btnConfirmSave.addEventListener('click', () => {
      const a = document.createElement('a');
      if (captureType === 'photo') {
        a.href = photoResult.src;
        a.download = `GUARDIAO_PONTO_FOTO_${Date.now()}.jpg`;
      } else {
        a.href = URL.createObjectURL(recordedBlob);
        a.download = `GUARDIAO_PONTO_VIDEO_${Date.now()}.webm`;
      }
      a.click();
      resetPreview();
    });

    // CANCELAR E REPETIR
    btnCancelRetake.addEventListener('click', resetPreview);

    function resetPreview() {
      photoResult.style.display = 'none';
      videoResult.style.display = 'none';
      canvas.style.display = 'block';
      
      confirmControls.style.display = 'none';
      mainControls.style.display = 'grid';
      
      isLoopActive = true;
      requestAnimationFrame(renderLoop);
    }

    // Modal Admin
    const adminModal = document.getElementById('adminModal');
    document.getElementById('btnOpenAdmin').addEventListener('click', () => adminModal.style.display = 'block');
    document.getElementById('btnCloseAdmin').addEventListener('click', () => adminModal.style.display = 'none');

    document.getElementById('btnLoginAdmin').addEventListener('click', () => {
      if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
        document.getElementById('adminAuth').style.display = 'none';
        document.getElementById('adminBody').style.display = 'block';
      } else {
        alert('Senha incorreta!');
      }
    });

    document.getElementById('btnAddVigia').addEventListener('click', () => {
      const nome = document.getElementById('addNome').value;
      if (!nome) return alert('Digite o nome do agente.');

      dbVigias.push({
        id: Date.now(),
        nome: nome.toUpperCase(),
        servico: document.getElementById('addServico').value.toUpperCase(),
        posto: document.getElementById('addPosto').value.toUpperCase(),
        endereco: document.getElementById('addEndereco').value.toUpperCase()
      });

      saveDB();
      renderVigiasDatalist();
      alert('Agente cadastrado com sucesso!');
      document.getElementById('addNome').value = '';
    });

    function deleteVigia(id) {
      dbVigias = dbVigias.filter(v => v.id !== id);
      saveDB();
      renderVigiasDatalist();
    }

    window.addEventListener('load', initApp);
  </script>
</body>
</html>
