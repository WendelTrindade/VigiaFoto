<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GUARDIÃO - Gerador de Ronda</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d; color: #f8fafc; min-height: 100vh;
      display: flex; flex-direction: column; padding: 12px;
    }

    .app-bar {
      background: #171717; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 2px solid #eab308;
      border-radius: 8px; margin-bottom: 12px;
    }
    .brand-title h1 { font-size: 1.1rem; color: #ffffff; font-weight: 900; }
    .brand-title span { font-size: 0.6rem; color: #eab308; font-weight: 700; display: block; }

    .container { max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }

    .card { background: #171717; padding: 12px; border-radius: 10px; border: 1px solid #262626; }
    .card label { font-size: 0.75rem; color: #eab308; font-weight: 800; display: block; margin-bottom: 4px; }
    
    .input-field, select {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #404040;
      background: #0d0d0d; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 8px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn-select {
      width: 100%; padding: 16px; border: 2px dashed #eab308; border-radius: 10px;
      background: #1a1805; color: #eab308; font-size: 1rem; font-weight: 800;
      cursor: pointer; text-align: center; display: block; margin-top: 5px;
    }

    .btn-action {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #16a34a; color: #fff; font-size: 1rem; font-weight: 900;
      cursor: pointer; display: none; margin-top: 10px;
    }

    /* Galeria de pré-visualização */
    .preview-grid {
      display: grid; grid-template-columns: repeat( auto-fill, minmax(90px, 1fr) );
      gap: 8px; margin-top: 10px; max-height: 250px; overflow-y: auto;
    }
    .preview-item {
      position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
      border: 1px solid #404040; background: #000;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-tag {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.8); color: #eab308; font-size: 0.65rem;
      font-weight: 800; text-align: center; padding: 2px 0;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="app-bar">
    <div class="brand-title">
      <h1>🛡️ GUARDIÃO</h1>
      <span>PROCESSADOR DE FOTOS DA RONDA</span>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <label>AGENTE DA RONDA:</label>
      <input type="text" id="txtAgente" class="input-field" value="CARLOS SILVA" placeholder="Nome do Agente">

      <div class="grid-2">
        <div>
          <label>Nº DA RONDA:</label>
          <input type="number" id="numRonda" class="input-field" value="1" min="1">
        </div>
        <div>
          <label>DATA/HORA:</label>

          <select id="selectDataModo" class="input-field">
            <option value="AGORA">Hora Atual (Automática)</option>
            <option value="ARQUIVO">Hora Original da Foto</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label>SELECIONAR FOTOS DA GALERIA OU CÂMERA:</label>
      <!-- Permite carregar várias fotos com qualidade original -->
      <label for="fileGallery" class="btn-select">📂 SELECCIONAR FOTOS ( GALERIA )</label>
      <input type="file" id="fileGallery" accept="image/*" multiple style="display: none;">

      <div class="preview-grid" id="previewGrid"></div>

      <button id="btnProcess" class="btn-action">⚡ PROCESSAR E BAIXAR FOTOS</button>
    </div>
  </div>

  <canvas id="workCanvas"></canvas>

  <script>
    const fileGallery = document.getElementById('fileGallery');
    const previewGrid = document.getElementById('previewGrid');
    const btnProcess = document.getElementById('btnProcess');
    const canvas = document.getElementById('workCanvas');
    const ctx = canvas.getContext('2d');

    let selectedFiles = [];

    fileGallery.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      selectedFiles = files;
      previewGrid.innerHTML = '';

      const numRonda = document.getElementById('numRonda').value;

      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `
            <img src="${event.target.result}">
            <div class="preview-tag">Foto ${idx + 1} - Ronda ${numRonda}</div>
          `;
          previewGrid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });

      btnProcess.style.display = 'block';
    });

    btnProcess.addEventListener('click', async () => {
      const agente = document.getElementById('txtAgente').value.toUpperCase() || 'AGENTE';
      const numRonda = document.getElementById('numRonda').value || '1';
      const modoData = document.getElementById('selectDataModo').value;

      btnProcess.disabled = true;
      btnProcess.innerText = "PROCESSANDO...";

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const numFoto = i + 1;
        
        let timeStr = "";
        if (modoData === "AGORA") {
          const now = new Date();
          timeStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        } else {
          const fileDate = new Date(file.lastModified);
          timeStr = `${String(fileDate.getDate()).padStart(2,'0')}/${String(fileDate.getMonth()+1).padStart(2,'0')}/${fileDate.getFullYear()} ${String(fileDate.getHours()).padStart(2,'0')}:${String(fileDate.getMinutes()).padStart(2,'0')}`;
        }

        await processAndDownload(file, agente, numRonda, numFoto, timeStr);
      }

      btnProcess.disabled = false;
      btnProcess.innerText = "⚡ PROCESSAR E BAIXAR FOTOS";
      alert("Todas as fotos foram processadas e salvas com sucesso!");
    });

    function processAndDownload(file, agente, ronda, fotoNum, dataHoraStr) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          // Mantém a qualidade original da resolução da foto
          canvas.width = img.width;
          canvas.height = img.height;

          // Desenha a foto na resolução nativa
          ctx.drawImage(img, 0, 0);

          // Configura o carimbo proporcional à foto
          const w = img.width;
          const h = img.height;
          const footerH = h * 0.18;
          const footerY = h - footerH;

          // Tarja preta de fundo
          ctx.fillStyle = 'rgba(13, 13, 13, 0.85)';
          ctx.fillRect(0, footerY, w, footerH);

          // Linha amarela de destaque
          ctx.fillStyle = '#eab308';
          ctx.fillRect(0, footerY, w, footerH * 0.04);

          const padX = w * 0.04;

          // Linha 1: Numeração sequencial (FOTO X DA RONDA Y)
          ctx.fillStyle = '#eab308';
          ctx.font = `900 ${footerH * 0.32}px sans-serif`;
          ctx.fillText(`FOTO ${fotoNum} - RONDA ${ronda}`, padX, footerY + (footerH * 0.40));

          // Linha 2: Agente e Data
          ctx.fillStyle = '#ffffff';
          ctx.font = `700 ${footerH * 0.22}px sans-serif`;
          ctx.fillText(`AGENTE: ${agente}  |  ${dataHoraStr}`, padX, footerY + (footerH * 0.75));

          // Baixa a imagem pronta
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/jpeg', 0.95);
          a.download = `RONDA_${ronda}_FOTO_${fotoNum}.jpg`;
          a.click();

          resolve();
        };
        img.src = URL.createObjectURL(file);
      });
    }
  </script>
</body>
</html>
