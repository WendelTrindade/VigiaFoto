<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GUARDIÃO - Sistema Completo</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d; color: #f8fafc; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .app-bar {
      background: #171717; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 2px solid #eab308;
    }
    .brand-title h1 { font-size: 1.1rem; color: #ffffff; font-weight: 900; }
    .brand-title span { font-size: 0.6rem; color: #eab308; font-weight: 700; display: block; }
    
    .btn-admin {
      background: #262626; color: #eab308; border: 1px solid #eab308;
      padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }

    .container {
      padding: 12px; max-width: 500px; margin: 0 auto; width: 100%;
      flex: 1; display: flex; flex-direction: column; gap: 10px;
    }

    .vigia-card { background: #171717; padding: 10px; border-radius: 10px; border: 1px solid #262626; }
    .vigia-card label { font-size: 0.7rem; color: #eab308; font-weight: 800; display: block; margin-bottom: 4px; }
    
    .search-input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #404040;
      background: #0d0d0d; color: #fff; font-size: 0.95rem; outline: none;
    }

    .badge-info {
      margin-top: 8px; padding: 8px; background: #0d0d0d; border-radius: 6px;
      font-size: 0.8rem; color: #d4d4d4; display: flex; flex-direction: column; gap: 2px;
    }

    .preview-card {
      background: #000; border-radius: 10px; overflow: hidden;
      border: 2px solid #262626; aspect-ratio: 3/4; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }

    .rec-status {
      position: absolute; top: 12px; left: 12px;
      background: rgba(220, 38, 38, 0.9); color: white;
      padding: 6px 12px; border-radius: 20px; font-weight: 800;
      font-size: 0.75rem; display: none; align-items: center; gap: 6px; z-index: 10;
    }
    .rec-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .toast-success {
      position: absolute; top: 10px; left: 10px; right: 10px;
      background: #16a34a; color: white; text-align: center;
      padding: 10px; border-radius: 8px; font-weight: 800; font-size: 0.85rem;
      display: none; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn {
      padding: 15px 10px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-photo { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; }
    .btn-video { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); color: #fff; }
    .btn-stop { background: #eab308; color: #000; grid-column: span 2; display: none; }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      z-index: 100; padding: 20px; overflow-y: auto;
    }
    .modal-content { max-width: 450px; margin: 0 auto; background: #171717; padding: 15px; border-radius: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 0.75rem; color: #a3a3a3; display: block; margin-bottom: 2px; }
    .form-group input { width: 100%; padding: 8px; background: #0d0d0d; border: 1px solid #404040; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="app-bar">
    <div class="brand-title">
      <h1>🛡️ GUARDIÃO</h1>
      <span>SISTEMA DE PLANTÃO</span>
    </div>
    <button class="btn-admin" id="btnOpenAdmin">⚙️ Admin</button>
  </div>

  <div class="container">
    <div class="vigia-card">
      <label for="searchVigia">AGENTE EM PLANTÃO:</label>
      <input type="text" id="searchVigia" class="search-input" list="vigiasList" placeholder="Selecione o nome...">
      <datalist id="vigiasList"></datalist>

      <div class="badge-info">
        <div>Posto: <strong id="lblPosto" style="color:#fff;">POSTO CENTRAL</strong></div>
        <div>Local: <strong id="lblLocal" style="color:#eab308;">Obtendo GPS...</strong></div>
      </div>
    </div>

    <div class="preview-card">
      <div class="rec-status" id="recBadge"><div class="rec-dot"></div> GRAVANDO VÍDEO...</div>
      <div class="toast-success" id="toastMsg">⚡ ARQUIVO SALVO COM SUCESSO!</div>
      
      <input type="file" id="nativeCameraInput" accept="image/*" capture="environment" style="display: none;">

      <video id="videoSource" autoplay playsinline style="display:none;"></video>
      <canvas id="canvasDisplay"></canvas>
    </div>

    <div class="btn-group">
      <button id="btnTakePhoto" class="btn btn-photo">📸 TIRAR FOTO</button>
      <button id="btnStartRecord" class="btn btn-video">🎥 GRAVAR VÍDEO</button>
      <button id="btnStopRecord" class="btn btn-stop">⏹️ PARAR GRAVAÇÃO</button>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <h3 style="color:#eab308; margin-bottom:10px;">Painel Admin</h3>
      <div id="adminAuth">
        <input type="password" id="adminPass" placeholder="Senha" style="width:100%; padding:8px; margin-bottom:10px;">
        <button onclick="loginAdmin()" style="width:100%; padding:8px; background:#eab308; font-weight:bold;">Entrar</button>
      </div>
      <div id="adminBody" style="display:none;">
        <div class="form-group"><label>Nome Agente:</label><input type="text" id="addNome"></div>
        <div class="form-group"><label>Posto:</label><input type="text" id="addPosto" value="POSTO CENTRAL"></div>
        <button onclick="addVigia()" style="width:100%; padding:8px; background:#16a34a; color:#fff; font-weight:bold; border:none; border-radius:4px;">Salvar Agente</button>
        <button onclick="closeAdmin()" style="width:100%; padding:8px; background:#dc2626; color:#fff; font-weight:bold; border:none; border-radius:4px; margin-top:10px;">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = '28642155';
    let dbVigias = JSON.parse(localStorage.getItem('dbVigias')) || [
      { id: 1, nome: 'CARLOS SILVA', posto: 'POSTO CENTRAL', servico: 'GUARDIÃO' }
    ];
    let currentVigia = dbVigias[0];
    let gpsAddress = 'LOCALIZANDO GPS...';

    const nativeCameraInput = document.getElementById('nativeCameraInput');
    const videoSource = document.getElementById('videoSource');
    const canvas = document.getElementById('canvasDisplay');
    const ctx = canvas.getContext('2d');
    const toastMsg = document.getElementById('toastMsg');
    const recBadge = document.getElementById('recBadge');

    const btnTakePhoto = document.getElementById('btnTakePhoto');
    const btnStartRecord = document.getElementById('btnStartRecord');
    const btnStopRecord = document.getElementById('btnStopRecord');

    let mediaRecorder;
    let recordedChunks = [];
    let audioStream = null;

    function init() {
      renderList();
      selectVigia(dbVigias[0].nome);
      initCamera();
      initGPS();
    }

    function renderList() {
      const list = document.getElementById('vigiasList');
      list.innerHTML = '';
      dbVigias.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.nome;
        list.appendChild(opt);
      });
    }

    function selectVigia(nome) {
      const found = dbVigias.find(v => v.nome.toUpperCase() === nome.toUpperCase());
      if (found) {
        currentVigia = found;
        document.getElementById('lblPosto').innerText = currentVigia.posto;
        document.getElementById('lblLocal').innerText = gpsAddress;
      }
    }

    document.getElementById('searchVigia').addEventListener('input', (e) => selectVigia(e.target.value));

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        videoSource.srcObject = stream;
        videoSource.play();
        requestAnimationFrame(renderLoop);
      } catch (e) {}
    }

    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
            const data = await res.json();
            gpsAddress = `${(data.address.road || 'RUA').toUpperCase()}, ${(data.address.city || data.address.town || 'CIDADE').toUpperCase()}`;
            document.getElementById('lblLocal').innerText = gpsAddress;
          } catch (e) { gpsAddress = "GPS ATIVO"; }
        });
      }
    }

    function renderLoop() {
      const w = videoSource.videoWidth || 1280;
      const h = videoSource.videoHeight || 720;
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      ctx.drawImage(videoSource, 0, 0, w, h);
      applyStamp(ctx, w, h);
      requestAnimationFrame(renderLoop);
    }

    function applyStamp(targetCtx, w, h) {
      const footerH = h * 0.25;
      const footerY = h - footerH;

      targetCtx.fillStyle = '#0d0d0d';
      targetCtx.fillRect(0, footerY, w, footerH);

      targetCtx.fillStyle = '#eab308';
      targetCtx.fillRect(0, footerY, w, footerH * 0.03);

      const padX = w * 0.04;
      const now = new Date();
      const horaStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      const dataStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;

      targetCtx.fillStyle = '#eab308';
      targetCtx.font = `900 ${footerH * 0.28}px sans-serif`;
      targetCtx.fillText(horaStr, padX, footerY + (footerH * 0.32));

      targetCtx.fillStyle = '#a3a3a3';
      targetCtx.font = `700 ${footerH * 0.12}px sans-serif`;
      targetCtx.fillText(`DATA: ${dataStr}`, padX, footerY + (footerH * 0.48));

      targetCtx.fillStyle = '#ffffff';
      targetCtx.font = `800 ${footerH * 0.12}px sans-serif`;
      targetCtx.fillText(`AGENTE: ${currentVigia.nome}`, padX, footerY + (footerH * 0.68));

      targetCtx.fillStyle = '#d4d4d4';
      targetCtx.font = `600 ${footerH * 0.11}px sans-serif`;
      targetCtx.fillText(`LOCAL: ${gpsAddress}`, padX, footerY + (footerH * 0.85));
    }

    // 1. DISPARO RÁPIDO DE FOTO
    btnTakePhoto.addEventListener('click', () => nativeCameraInput.click());

    nativeCameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        applyStamp(ctx, img.width, img.height);

        saveFile(canvas.toDataURL('image/jpeg', 0.90), `PONTO_FOTO_${currentVigia.nome.replace(/\s+/g, '_')}_${Date.now()}.jpg`);
        nativeCameraInput.value = '';
      };
      img.src = URL.createObjectURL(file);
    });

    // 2. GRAVAÇÃO DE VÍDEO (MICROFONE APENAS AQUI)
    btnStartRecord.addEventListener('click', async () => {
      recordedChunks = [];
      try {
        // Ativa o microfone SOMENTE durante este clique
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const canvasStream = canvas.captureStream(30);
        const audioTrack = audioStream.getAudioTracks()[0];
        if (audioTrack) canvasStream.addTrack(audioTrack);

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          saveFile(URL.createObjectURL(blob), `PONTO_VIDEO_${currentVigia.nome.replace(/\s+/g, '_')}_${Date.now()}.webm`);
          stopMicrophone(); // Encerra o microfone imediatamente
        };

        mediaRecorder.start();
        recBadge.style.display = 'flex';
        btnTakePhoto.style.display = 'none';
        btnStartRecord.style.display = 'none';
        btnStopRecord.style.display = 'flex';

      } catch (err) {
        alert("Erro ao acessar o microfone para gravação.");
      }
    });

    btnStopRecord.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      recBadge.style.display = 'none';
      btnStopRecord.style.display = 'none';
      btnTakePhoto.style.display = 'flex';
      btnStartRecord.style.display = 'flex';
    });

    function stopMicrophone() {
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
    }

    function saveFile(url, fileName) {
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();

      toastMsg.style.display = 'block';
      setTimeout(() => { toastMsg.style.display = 'none'; }, 1500);
    }

    // Admin
    document.getElementById('btnOpenAdmin').onclick = () => document.getElementById('adminModal').style.display = 'block';
    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
    function loginAdmin() {
      if (document.getElementById('adminPass').value === ADMIN_PASS) {
        document.getElementById('adminAuth').style.display = 'none';
        document.getElementById('adminBody').style.display = 'block';
      }
    }
    function addVigia() {
      const nome = document.getElementById('addNome').value;
      if (!nome) return;
      dbVigias.push({ id: Date.now(), nome: nome.toUpperCase(), posto: document.getElementById('addPosto').value.toUpperCase() });
      localStorage.setItem('dbVigias', JSON.stringify(dbVigias));
      renderList();
      closeAdmin();
    }

    window.onload = init;
  </script>
</body>
</html>
