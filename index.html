<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GUARDIÃO - Sistema Fixo</title>
  <style>
    :root { --gold: #eab308; --red: #dc2626; --bg: #121212; --card: #1e1e1e; --text: #fff; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 80px; }
    .header { background: var(--card); padding: 15px; border-bottom: 3px solid var(--gold); text-align: center; }
    
    /* Abas */
    .tab { display: none; padding: 15px; }
    .tab.active { display: block; }
    .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; border-top: 1px solid #333; }
    .nav-btn { flex: 1; padding: 15px; background: none; border: none; color: #fff; font-weight: bold; }
    .nav-btn.active { color: var(--gold); border-top: 2px solid var(--gold); }

    /* Cards */
    .card { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
    .thumb { aspect-ratio: 1; background: #333; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    @media print { .no-print { display: none; } body { background: #fff; color: #000; } }
  </style>
</head>
<body>

  <div class="header"><h1>🛡️ GUARDIÃO</h1></div>

  <!-- ABA 1: DASHBOARD (Cards) -->
  <div id="tab1" class="tab active">
    <h3>Seus Registros</h3>
    <div id="dashboardContainer"></div>
  </div>

  <!-- ABA 2: NOVO REGISTRO -->
  <div id="tab2" class="tab">
    <div class="card">
        <select id="regType" class="card" style="width:100%" onchange="toggleType()">
            <option value="RONDA">🔄 RONDA</option>
            <option value="OCORRENCIA">⚠️ OCORRÊNCIA</option>
        </select>
        <input type="text" id="inpID" class="card" style="width:100%; border:none; background:#333; color:#fff" placeholder="Ex: Ronda 1 ou Ocorrencia 01">
        <div id="divOcorrencia" style="display:none">
            <select id="inpPrio" class="card" style="width:100%"><option>ALTA</option><option>MÉDIA</option><option>BAIXA</option></select>
            <textarea id="inpObs" class="card" style="width:100%" placeholder="Observações da Ocorrência"></textarea>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
        <button class="btn" style="background:var(--gold)" onclick="document.getElementById('fileInput').click()">SELECIONAR FOTOS</button>
        <button class="btn" style="background:#28a745; color:#fff" onclick="salvarRegistro()">PROCESSAR E SALVAR</button>
    </div>
  </div>

  <!-- ABA 3: ADMIN & PDF -->
  <div id="tab3" class="tab">
    <div class="card">
        <h3>⚙️ CONFIGURAR ESTAMPA</h3>
        <div id="adminFields"></div>
        <input type="text" id="newField" placeholder="Novo campo (ex: Local)" class="card" style="width:100%; border:none">
        <button class="btn" onclick="addField()">+ ADICIONAR CAMPO</button>
        <button class="btn" style="background:var(--gold)" onclick="saveConfig()">SALVAR CONFIG</button>
    </div>
    <div class="card">
        <button class="btn" style="background:#007bff; color:#fff" onclick="window.print()">GERAR RELATÓRIO PDF</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="showTab(1)">DASHBOARD</button>
    <button class="nav-btn" onclick="showTab(2)">NOVO</button>
    <button class="nav-btn" onclick="showTab(3)">CONFIG</button>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    let db, config = JSON.parse(localStorage.getItem('g_cfg')) || {fields: ['Data', 'Hora', 'Agente']};
    
    // DB Init
    const req = indexedDB.open("GuardiaoDB", 11);
    req.onupgradeneeded = e => e.target.result.createObjectStore("regs", { keyPath: "id" });
    req.onsuccess = e => { db = e.target.result; renderDashboard(); renderAdmin(); };

    function showTab(n) {
        document.querySelectorAll('.tab').forEach((t, i) => t.className = (i+1==n ? 'tab active' : 'tab'));
        document.querySelectorAll('.nav-btn').forEach((b, i) => b.className = (i+1==n ? 'nav-btn active' : 'nav-btn'));
    }

    function toggleType() {
        document.getElementById('divOcorrencia').style.display = (document.getElementById('regType').value === 'OCORRENCIA' ? 'block' : 'none');
    }

    // ADMIN
    function renderAdmin() {
        const div = document.getElementById('adminFields');
        div.innerHTML = config.fields.map((f, i) => `<div class="card">${f} <button onclick="config.fields.splice(${i},1);renderAdmin()">X</button></div>`).join('');
    }
    function addField() {
        config.fields.push(document.getElementById('newField').value);
        renderAdmin();
    }
    function saveConfig() { localStorage.setItem('g_cfg', JSON.stringify(config)); alert("Salvo!"); }

    // DADOS
    async function salvarRegistro() {
        const type = document.getElementById('regType').value;
        const id = document.getElementById('inpID').value;
        const files = document.getElementById('fileInput').files;
        let images = [];

        for(let file of files) {
            images.push(await draw(file, type, id));
        }

        const data = { id, type, images, meta: { prio: document.getElementById('inpPrio').value, obs: document.getElementById('inpObs').value } };
        db.transaction("regs", "readwrite").objectStore("regs").put(data);
        alert("Salvo!");
        renderDashboard();
    }

    function draw(file, type, id) {
        return new Promise(res => {
            const img = new Image();
            img.onload = () => {
                const c = document.getElementById('canvas');
                const ctx = c.getContext('2d');
                c.width = img.width; c.height = img.height;
                ctx.drawImage(img, 0, 0);
                ctx.fillStyle = type === 'OCORRENCIA' ? 'red' : 'black';
                ctx.fillRect(0, img.height-200, img.width, 200);
                ctx.fillStyle = 'white';
                ctx.font = '50px sans-serif';
                ctx.fillText(id + " | " + config.fields.join(' | '), 50, img.height-100);
                res(c.toDataURL());
            };
            img.src = URL.createObjectURL(file);
        });
    }

    function renderDashboard() {
        const cont = document.getElementById('dashboardContainer');
        cont.innerHTML = '';
        db.transaction("regs", "readonly").objectStore("regs").getAll().onsuccess = e => {
            e.target.result.forEach(r => {
                cont.innerHTML += `
                    <div class="card" onclick="this.lastElementChild.style.display=(this.lastElementChild.style.display==='none'?'grid':'none')">
                        <h3>${r.type}: ${r.id} ${r.type==='OCORRENCIA'?'('+r.meta.prio+')':''}</h3>
                        <p>${r.meta.obs || ''}</p>
                        <div class="grid" style="display:none">${r.images.map(i => `<div class="thumb"><img src="${i}"></div>`).join('')}</div>
                    </div>`;
            });
        };
    }
  </script>
</body>
</html>
